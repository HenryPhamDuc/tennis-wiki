# =============================================================================
# Sveltia CMS config for the Tennis Knowledge Base (HenryPhamDuc/tennis-wiki)
# =============================================================================
# Lives at: docs/admin/config.yml
# Editor URL: https://henryphamduc.github.io/tennis-wiki/admin/
#
# Authentication: GitHub OAuth (Sveltia supports the same flow as Decap).
# Until you wire an OAuth proxy, "Sign in with GitHub" requires the browser
# extension bypass OR a local proxy. Easiest path is `npx decap-cms-oauth`
# or a Cloudflare Worker. See:
#   https://sveltia.com/docs/configuration/backends#github-backend
#   https://github.com/vencax/netlify-cms-oauth-provider
#
# Content schema: one folder collection per MkDocs section.
# Each collection edits files IN PLACE under docs/<lang>/<section>/ — no
# file moves, no content reformatting, no risk of breaking MkDocs nav.
# =============================================================================

backend:
  name: github
  repo: HenryPhamDuc/tennis-wiki          # owner/repo
  branch: main                             # site is deployed from main
  commit_messages:
    create: 'cms: create {{collection}} "{{slug}}"'
    update: 'cms: edit {{collection}} "{{slug}}"'
    delete: 'cms: delete {{collection}} "{{slug}}"'
    uploadMedia: 'cms: upload media "{{path}}"'
    deleteMedia: 'cms: delete media "{{path}}"'
    openAuthoring: 'cms: {{message}}'
  squash_merges: true
  open_authoring: false                    # only Henry can edit (private site)

# Media uploads go to docs/assets/uploads/<collection>/<filename>
# MkDocs already serves docs/assets/ at /assets/, so images Just Work.
media_folder: "docs/assets/uploads/{{collection_name}}"
public_folder: "/tennis-wiki/assets/uploads/{{collection_name}"

# Site-wide settings
site_url: https://henryphamduc.github.io/tennis-wiki
display_url: https://henryphamduc.github.io/tennis-wiki
logo_url: /tennis-wiki/assets/images/logo.png   # optional, can be empty

# Editor preferences
locale: en
search: true
live_preview: false                        # MkDocs doesn't have an HMR dev URL

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
# One collection per MkDocs section. The `folder` field points at the existing
# directory; `extension: md` reads/writes the .md files MkDocs already serves.
# `frontmatter_delimiter: ["---", "---"]` works on existing files that have
# frontmatter; files without frontmatter get it added on first save.
#
# For each section the schema is intentionally minimal:
#   - title (H1, derived from first # heading)
#   - body (everything after H1)
# This matches the existing MkDocs convention and avoids forcing Henry to
# restructure hundreds of files just to onboard the CMS.
# -----------------------------------------------------------------------------

collections:

  # ============================ ENGLISH ====================================
  - name: "en-home"
    label: "🇬🇧 EN — Home"
    label_singular: "EN Home"
    description: "English landing page at /en/"
    folder: "docs/en"
    create: false                          # only index.md exists
    delete: false
    extension: "md"
    format: "frontmatter"
    frontmatter_delimiter: ["---", "---"]
    slug: "{{slug}}"
    path: "{{slug}}/index"                 # writes to docs/en/<slug>/index.md
    media_folder: "/docs/assets/uploads/en-home"
    public_folder: "/tennis-wiki/assets/uploads/en-home"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "en-foundation"
    label: "🇬🇧 EN — Foundation (141 files)"
    label_singular: "EN Foundation Page"
    description: "Grips, footwork, strokes, doubles — the building blocks."
