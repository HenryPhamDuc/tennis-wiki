name: Mirror CMS files from docs/ to site/

on:
  push:
    paths:
      - 'docs/admin/**'
      - '.github/workflows/mirror-admin.yml'

# Default GITHUB_TOKEN is read-only. Need contents:write so this
# workflow can push its mirror commit back to main.
permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mirror docs/admin -> site/admin
        run: |
          mkdir -p site/admin
          # rsync-like mirror: copy full docs/admin tree to site/admin
          # AND delete any files in site/admin that aren't in docs/admin
          # (otherwise renamed/removed files would leak forever)
          cp -rT docs/admin site/admin
          # Find files in site/admin not in docs/admin and remove them
          comm -23 \
            <(cd site/admin && find . -type f | sort) \
            <(cd docs/admin && find . -type f | sort) \
          | while read f; do rm -f "site/admin/$f"; done
          cp -f docs/.nojekyll site/.nojekyll 2>/dev/null || true
          echo "Mirrored site/admin/ contents:"
          ls -la site/admin/

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain site/admin/ .nojekyll 2>/dev/null)" ]; then
            git add site/admin/ .nojekyll
            git commit -m "cms: mirror docs/admin/ to site/admin/ [skip ci]"
            git push origin HEAD:main
          else
            echo "site/admin/ already in sync, nothing to commit"
          fi
