<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .timezone-label {
            color: #fff;
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 2.5em;
            color: #fff;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .date-display {
            color: #fff;
            font-size: 0.85em;
            opacity: 0.85;
        }

        .offset-info {
            color: #fff;
            font-size: 0.8em;
            opacity: 0.75;
            margin-top: 8px;
        }

        .add-timezone-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        select {
            padding: 12px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            color: #333;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .remove-btn {
            background: #ff6b6b;
            padding: 8px 12px;
            font-size: 0.85em;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .remove-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }

        .label-text {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        .info-text {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .time-display {
                font-size: 1.8em;
            }

            .add-timezone-section {
                flex-direction: column;
            }

            select, button {
                width: 100%;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Multi-Timezone Clock</h1>
        
        <div class="info-text">
            Track time across different timezones in real-time
        </div>

        <div class="add-timezone-section">
            <select id="timezoneSelect">
                <option value="">Select a timezone...</option>
            </select>
            <button onclick="addTimezone()">Add Timezone</button>
        </div>

        <div class="clocks-grid" id="clocksContainer">
            <!-- Clock cards will be added here -->
        </div>
    </div>

    <script>
        // Comprehensive timezone list
        const timezones = [
            { name: 'New York', zone: 'America/New_York' },
            { name: 'Los Angeles', zone: 'America/Los_Angeles' },
            { name: 'Chicago', zone: 'America/Chicago' },
            { name: 'Denver', zone: 'America/Denver' },
            { name: 'Phoenix', zone: 'America/Phoenix' },
            { name: 'London', zone: 'Europe/London' },
            { name: 'Paris', zone: 'Europe/Paris' },
            { name: 'Berlin', zone: 'Europe/Berlin' },
            { name: 'Tokyo', zone: 'Asia/Tokyo' },
            { name: 'Sydney', zone: 'Australia/Sydney' },
            { name: 'Dubai', zone: 'Asia/Dubai' },
            { name: 'Singapore', zone: 'Asia/Singapore' },
            { name: 'Hong Kong', zone: 'Asia/Hong_Kong' },
            { name: 'Bangkok', zone: 'Asia/Bangkok' },
            { name: 'Mumbai', zone: 'Asia/Kolkata' },
            { name: 'Istanbul', zone: 'Europe/Istanbul' },
            { name: 'Moscow', zone: 'Europe/Moscow' },
            { name: 'São Paulo', zone: 'America/Sao_Paulo' },
            { name: 'Mexico City', zone: 'America/Mexico_City' },
            { name: 'Toronto', zone: 'America/Toronto' },
            { name: 'Vancouver', zone: 'America/Vancouver' },
            { name: 'Auckland', zone: 'Pacific/Auckland' },
            { name: 'Fiji', zone: 'Pacific/Fiji' },
            { name: 'Honolulu', zone: 'Pacific/Honolulu' },
            { name: 'UTC', zone: 'UTC' },
            { name: 'Seoul', zone: 'Asia/Seoul' },
            { name: 'Bangkok', zone: 'Asia/Bangkok' },
            { name: 'Johannesburg', zone: 'Africa/Johannesburg' },
            { name: 'Cairo', zone: 'Africa/Cairo' },
            { name: 'Tehran', zone: 'Asia/Tehran' }
        ];

        let activeClocks = [];

        // Populate timezone select
        function populateSelect() {
            const select = document.getElementById('timezoneSelect');
            timezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz.zone;
                option.textContent = tz.name;
                select.appendChild(option);
            });
        }

        // Add timezone to display
        function addTimezone() {
            const select = document.getElementById('timezoneSelect');
            const zone = select.value;
            
            if (!zone) {
                alert('Please select a timezone');
                return;
            }

            if (activeClocks.find(c => c.zone === zone)) {
                alert('This timezone is already displayed');
                return;
            }

            const tzName = timezones.find(t => t.zone === zone)?.name || zone;
            activeClocks.push({ name: tzName, zone: zone });
            select.value = '';
            updateClocks();
        }

        // Remove timezone
        function removeTimezone(zone) {
            activeClocks = activeClocks.filter(c => c.zone !== zone);
            updateClocks();
        }

        // Update all clocks
        function updateClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = '';

            activeClocks.forEach(clock => {
                const clockCard = createClockCard(clock);
                container.appendChild(clockCard);
            });
        }

        // Create a clock card element
        function createClockCard(clock) {
            const card = document.createElement('div');
            card.className = 'clock-card';

            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: clock.zone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const dateFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: clock.zone,
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });

            const time = formatter.format(now);
            const date = dateFormatter.format(now);

            // Calculate offset
            const tzTime = new Date(now.toLocaleString('en-US', { timeZone: clock.zone }));
            const offset = (tzTime - now) / (1000 * 60 * 60);
            const offsetSign = offset >= 0 ? '+' : '';
            const offsetStr = `UTC ${offsetSign}${offset}`;

            card.innerHTML = `
                <div class="timezone-label">${clock.name}</div>
                <div class="time-display" id="time-${clock.zone}">${time}</div>
                <div class="date-display">${date}</div>
                <div class="offset-info">${offsetStr}</div>
                <button class="remove-btn" onclick="removeTimezone('${clock.zone}')">Remove</button>
            `;

            return card;
        }

        // Update time every second
        function startClock() {
            setInterval(() => {
                activeClocks.forEach(clock => {
                    const now = new Date();
                    const formatter = new Intl.DateTimeFormat('en-US', {
                        timeZone: clock.zone,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    });

                    const timeElement = document.getElementById(`time-${clock.zone}`);
                    if (timeElement) {
                        timeElement.textContent = formatter.format(now);
                    }
                });
            }, 1000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            populateSelect();
            
            // Add default timezones
            activeClocks = [
                { name: 'New York', zone: 'America/New_York' },
                { name: 'London', zone: 'Europe/London' },
                { name: 'Tokyo', zone: 'Asia/Tokyo' }
            ];
            
            updateClocks();
            startClock();
        });
    </script>
</body>
</html>
